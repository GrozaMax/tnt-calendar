[pytest]
# Pytest конфигурация для TNT Calendar

# Настройки асинхронности
asyncio_mode = auto

# Паттерны для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Директории для поиска тестов
testpaths = tests

# Опции по умолчанию
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Маркеры для категоризации тестов
markers =
    unit: Unit tests (быстрые тесты отдельных компонентов)
    integration: Integration tests (тесты взаимодействия компонентов)
    api: API tests (тесты веб-API)
    slow: Slow tests (медленные тесты)
    asyncio: Async tests (асинхронные тесты)

# Покрытие кода
[coverage:run]
source = src, web
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

