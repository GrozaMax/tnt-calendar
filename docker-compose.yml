services:
  bot:
    build: .
    image: tnt-calendar:latest
    command: python main.py
    env_file: .env
    volumes:
      - app_data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/crossfit_hub.db
      - UPLOADS_DIR=/app/data/uploads
      - TZ=Asia/Tbilisi
    restart: unless-stopped

  web:
    image: tnt-calendar:latest
    command: python run_web.py
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/crossfit_hub.db
      - UPLOADS_DIR=/app/data/uploads
      - TZ=Asia/Tbilisi
    restart: unless-stopped
    depends_on:
      - bot

volumes:
  app_data: